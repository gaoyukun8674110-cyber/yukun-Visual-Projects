server {
    listen 80;
    server_name _;

    client_max_body_size 512m;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/media {
        limit_req zone=api_write burst=5 nodelay;
        limit_conn api_conn 10;
        proxy_pass http://api:8000/api/media;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/jobs {
        limit_req zone=api_write burst=5 nodelay;
        limit_conn api_conn 10;
        proxy_pass http://api:8000/api/jobs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ws/ {
        proxy_pass http://api:8000/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn api_conn 10;
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Adminer database console — Basic Auth protected, only reachable via nginx.
    location = /db {
        return 301 /db/;
    }

    location /db/ {
        auth_basic "YOLO DB Console";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=api_rl burst=20 nodelay;
        limit_conn api_conn 10;

        proxy_pass http://adminer:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        return 404;
    }
}
