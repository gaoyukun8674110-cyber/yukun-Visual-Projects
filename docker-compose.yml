services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yolo}
      POSTGRES_USER: ${POSTGRES_USER:-yolo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yolo} -d ${POSTGRES_DB:-yolo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_in_prod}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change_me_in_prod}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://yolo:change_me_in_prod@postgres:5432/yolo}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-change_me_in_prod}@redis:6379/0}
      STORAGE_ROOT: /app/storage
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      API_KEYS: ${API_KEYS:-devkey1}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://localhost:3000","http://127.0.0.1:3000"]}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-["best.pt"]}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
      QUOTA_JOBS_PER_DAY: ${QUOTA_JOBS_PER_DAY:-200}
      QUOTA_STORAGE_MB: ${QUOTA_STORAGE_MB:-10240}
      QUOTA_CONCURRENT_JOBS: ${QUOTA_CONCURRENT_JOBS:-3}
      QUEUE_MAX_DEPTH: ${QUEUE_MAX_DEPTH:-500}
    mem_limit: 1g
    cpus: "1.0"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://yolo:change_me_in_prod@postgres:5432/yolo}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-change_me_in_prod}@redis:6379/0}
      STORAGE_ROOT: /app/storage
      YOLO_DEVICE: ${YOLO_DEVICE:-auto}
    gpus: all
    mem_limit: 4g
    cpus: "2.0"
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-devkey1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api}
      NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-devkey1}
    depends_on:
      api:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx-http.conf:/etc/nginx/conf.d/00-rate-limits.conf:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      adminer:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
